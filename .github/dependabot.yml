version: 2
updates:
  # One pull request per ecosystem and week, not one per dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      composer:
        patterns: ["*"]
