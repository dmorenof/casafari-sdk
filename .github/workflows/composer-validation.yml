name: Composer package metadata

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Keep the "validate" job name: master protection requires this exact check.
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Validate library manifest
        run: composer validate --strict --no-check-lock
