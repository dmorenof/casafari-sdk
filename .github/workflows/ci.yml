name: PHP SDK CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the "test" job name: master protection requires this exact check.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: pcov
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-php83-${{ runner.os }}-${{ hashFiles('composer.json') }}
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: find src Tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests and collect coverage
        run: |
          mkdir -p coverage
          vendor/bin/phpunit -c phpunit.xml --coverage-text --coverage-clover coverage/clover.xml
      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-8.3-coverage
          path: coverage/clover.xml
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run tests
        run: vendor/bin/phpunit -c phpunit.xml

  minimum-dependencies:
    name: Minimum compatible dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install lowest permitted dependency versions
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress
      - name: Run tests
        run: vendor/bin/phpunit -c phpunit.xml

  security:
    name: Dependency advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Resolve dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit direct and transitive dependencies
        run: composer audit --no-interaction --format=plain
