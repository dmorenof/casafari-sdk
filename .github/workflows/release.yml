name: Publish version

# Do not modify an existing tag. VERSION changes are the sole automatic
# publication trigger; normal commits do not produce releases.
on:
  push:
    branches: [master]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-master
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable Git tag and GitHub Release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must be a numeric X.Y.Z value" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check for existing immutable version
        id: existing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            echo "Version $TAG already tagged at $TAG_SHA; never move published tags."
            if [[ "$TAG_SHA" == "$GITHUB_SHA" ]]; then
              echo "publish_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_release=false" >> "$GITHUB_OUTPUT"
            fi
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate manifest
        if: steps.existing.outputs.create_tag == 'true'
        run: composer validate --strict --no-check-lock
      - name: Install dependencies
        if: steps.existing.outputs.create_tag == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        if: steps.existing.outputs.create_tag == 'true'
        run: find src Tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run full test suite
        if: steps.existing.outputs.create_tag == 'true'
        run: vendor/bin/phpunit -c phpunit.xml
      - name: Audit dependencies
        if: steps.existing.outputs.create_tag == 'true'
        run: composer audit --no-interaction --format=plain
      - name: Create tag when absent
        if: steps.existing.outputs.create_tag == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag appeared during release; refusing to replace it." >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Publish GitHub Release when missing
        if: steps.existing.outputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
