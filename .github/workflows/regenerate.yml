name: Regenerate the SDK (manual)

# Manual: generates src/ again from contract/openapi.json with a version (or branch) of sdk-generator, and commits the result
# to the branch it runs on. The generated code is never edited by hand: when it should change, the contract or the generator does.
on:
  push:
    branches: [claude/busy-franklin-9x9zpa]
    paths: ['.github/workflows/regenerate.yml'] # TEMPORARY: until the workflow is on the default branch
  workflow_dispatch:
    inputs:
      generator_ref:
        description: 'Branch or tag of dmorenof/sdk-generator'
        default: 'claude/busy-franklin-9x9zpa'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dmorenof/sdk-generator
          ref: ${{ inputs.generator_ref || 'claude/busy-franklin-9x9zpa' }}
          path: generator
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --working-dir=generator --no-interaction --prefer-dist --no-progress --quiet
      - name: Generate
        run: |
          rm -rf /tmp/gen
          php generator/bin/generate-sdk.php contract/openapi.json /tmp/gen CasafariSDK dmorenof/casafari-sdk
          rm -rf src && cp -r /tmp/gen/src src
      - name: Commit what changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src
          if git diff --cached --quiet; then echo 'The generated code is already up to date.'; exit 0; fi
          git diff --cached --stat | tail -1
          git commit -m "Regenerate the SDK with sdk-generator ($(git -C generator rev-parse --short HEAD))"
          git push
